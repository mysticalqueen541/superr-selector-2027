name: Dashboard regression checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py analytics.py bowling_analytics.py tests
      - name: Run all format and ranking checks
        run: python -m unittest discover -s tests -v
